<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Identifier for JS -->
    <div id="details-page-identifier" style="display:none;"></div>

    <header>
        <div class="logo">Stream<span>Flix</span></div>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <div class="container">
        <a href="index.html" class="back-btn">← Back to Browse</a>

        <div class="details-hero">
            <div class="details-poster">
                <img id="poster-img" src="" alt="Movie Poster">
            </div>
            <div class="details-info">
                <h1 id="movie-title">Loading...</h1>
                <div class="chips" id="genre-chips">
                    <!-- Chips JS -->
                </div>
                <div class="rating" id="movie-release"></div>
                <p class="overview-text" id="movie-overview">

                </p>
                <button style="
                    background: var(--primary); 
                    color: white; 
                    border: none; 
                    padding: 12px 30px; 
                    border-radius: 4px; 
                    font-weight: bold; 
                    cursor: pointer;
                    font-size: 1rem;">
                    ▶ Play Trailer
                </button>
            </div>
        </div>

        <hr>

        <h2 class="section-title">You Might Also Like</h2>
        <div class="grid" id="rec-grid">
            <!-- Recs JS -->
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
