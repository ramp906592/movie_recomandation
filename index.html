<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Movie Recommender</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Identifier for JS -->
    <div id="home-page-identifier" style="display:none;"></div>

    <header>
        <div class="logo">Stream<span>Flix</span></div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="#mylist">My List</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Find your next obsession.</h1>
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Search movies, genres, actors...">
        </div>
    </div>

    <!-- HAMBURGER BUTTON -->
    <button id="menu-btn" class="menu-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <!-- SIDEBAR & OVERLAY -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <div id="sidebar" class="sidebar">
        <button id="close-btn" class="close-btn">&times;</button>

        <div class="sidebar-content">
            <h3>Discover</h3>
            <div class="sidebar-menu">
                <button class="menu-item active" data-category="popular">Popular</button>
                <button class="menu-item" data-category="trending">Trending</button>
                <button class="menu-item" data-category="top_rated">Top Rated</button>
                <button class="menu-item" data-category="upcoming">Upcoming</button>
                <button class="menu-item" data-category="now_playing">Now Playing</button>
            </div>

            <hr>

            <h3>Appearance</h3>
            <div class="control-group">
                <label>Poster Size</label>
                <input type="range" id="grid-slider" min="120" max="300" value="180" step="10">
            </div>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">Trending Now</h2>
        <div class="grid" id="movie-grid">
            <!-- Cards injected by JS -->
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
